<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>層積検尺</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b4513">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="層積検尺">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.roboflow.com/0.2.26/roboflow.js"></script>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WXBP6CPKLP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WXBP6CPKLP');
    </script>
    
    <style>
        body { font-family: -apple-system, sans-serif; padding: 10px; background: #fdf5e6; color: #333; margin: 0; padding-bottom: 40px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .header { border-bottom: 2px solid #8b4513; margin-bottom: 10px; padding-bottom: 5px; }
        h2 { margin: 0; font-size: 1.2em; color: #5d4037; }
        
        .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; color: white; margin-bottom: 10px; cursor: pointer; text-align: center; box-sizing: border-box;}
        .btn-blue { background: #1565c0; }
        .btn-green { background: #2e7d32; }
        .btn-orange { background: #e65100; }
        .btn-gray { background: #757575; }
        .btn-purple { background: #673ab7; }
        .btn-teal { background: #00897b; }
        .btn:disabled { background: #bdbdbd !important; cursor: not-allowed; }

        #canvas-container { position: relative; width: 100%; max-height: 60vh; overflow: hidden; border: 1px solid #ccc; background: #000; border-radius: 8px; margin-bottom: 10px; text-align: center; }
        canvas { max-width: 100%; height: auto; display: block; margin: 0 auto; touch-action: none; cursor: crosshair;}
        
        .control-group { margin-bottom: 15px; background: #fff3e0; padding: 10px; border-radius: 8px; border: 1px solid #ffcc80; }
        .control-group.ai-group { background: #f3e5f5; border-color: #ce93d8; }
        .control-group.rf-group { background: #e8f5e9; border-color: #81c784; }
        
        label { font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px; color: #5d4037;}
        input[type="range"] { width: 100%; margin: 10px 0; cursor: pointer;}
        input[type="number"], input[type="password"], select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; box-sizing: border-box; margin-bottom: 8px; background: white;}
        
        .input-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .input-row label { margin-bottom: 0; width: 35%; }
        .input-row select { width: 63%; margin-bottom: 0; }

        .result-box { background: #e8f5e9; border: 2px solid #4caf50; padding: 15px; border-radius: 8px; text-align: center; font-size: 1.2em; font-weight: bold; color: #1b5e20; margin-bottom: 15px; }
        #status-text { color: #d32f2f; font-weight: bold; font-size: 0.9em; margin-bottom: 10px; text-align: center; }
        
        .color-preview { display: block; width: 100%; height: 25px; border: 1px solid #999; margin-bottom: 5px; border-radius: 4px; }
        
        .toggle-box { margin-top: 15px; padding: 10px; background: #fff; border-radius: 6px; border: 1px solid #ccc; }
        .toggle-label { display: flex; align-items: center; margin: 0; color: #1565c0; cursor: pointer; }
        .toggle-checkbox { width: auto; margin: 0 10px 0 0; transform: scale(1.3); }
        .toggle-desc { font-size: 0.8em; color: #666; margin-left: 5px; font-weight: normal; }

        .toolbar { display: flex; gap: 5px; margin-bottom: 10px; }
        .tool-btn { flex: 1; padding: 10px; border: 2px solid #ccc; border-radius: 6px; background: #eee; text-align: center; font-weight: bold; cursor: pointer;}
        .tool-btn.active { background: #ffcc80; border-color: #e65100; color: #e65100; }
        
        .photo-buttons { display: flex; gap: 10px; margin-bottom: 10px; }
        .photo-buttons label { flex: 1; margin-bottom: 0; }
    </style>
</head>
<body>

<div class="card">
    <div class="header"><h2>層積検尺 v2.0<span style="font-size:0.7em; color:#757575;"> (AIハイブリッド版)</span></h2></div>
    
    <div class="photo-buttons">
        <label class="btn btn-blue">
            📸 写真を撮る
            <input type="file" id="imageInputCamera" accept="image/*" capture="environment" style="display: none;">
        </label>
        <label class="btn btn-blue" style="background-color: #0288d1;">
            🖼️ 写真を選ぶ
            <input type="file" id="imageInputFile" accept="image/*" style="display: none;">
        </label>
    </div>

    <div id="status-text">1. 写真を読み込んでください</div>

    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <div class="result-box">
        概算材積: <span id="resultVolume" style="font-size: 1.5em; color: #d32f2f;">0.000</span> m³
        <div style="font-size: 0.6em; color: #555; margin-top: 5px;">
            抽出面積: <span id="resultArea">0.000</span> m² / ピクセル数: <span id="pixelCount">0</span> px
        </div>
    </div>

    <!-- Roboflow による高速自動赤塗りエリア（内部上限1000本） -->
    <div class="control-group rf-group">
        <label style="color: #2e7d32;">🧠 オプションA: Roboflowによる自動赤塗り（オフライン高速）</label>
        <button class="btn btn-teal" id="btnLoadModel" onclick="loadRoboflowModel()">📥 認識モデル読込（要オンライン環境）</button>
        <div class="input-row">
            <label style="color: #2e7d32;">🎯 検出感度</label>
            <select id="rfThresholdSelect" style="border-color: #81c784;">
                <option value="0.25">甘め・多めに検出 (25%以上)</option>
                <option value="0.40" selected>標準バランス (40%以上)</option>
                <option value="0.60">厳しめ・確実のみ (60%以上)</option>
            </select>
        </div>
        <button class="btn btn-green" id="btnRunRF" onclick="runRoboflowPainting()" style="margin-bottom: 0;">⚡ Roboflowで一括赤塗り</button>
    </div>

    <!-- Gemini 4 対応 AI自動赤塗りエリア -->
    <div class="control-group ai-group">
        <label style="color: #4a148c;">🤖 オプションB: Geminiによる自動赤塗り（オンライン高精度）</label>
        <input type="password" id="geminiApiKey" placeholder="Gemini APIキー (初回のみ)">
        <div class="input-row">
            <label style="color: #4a148c;">🧠 思考レベル</label>
            <select id="thinkingLevelSelect" style="border-color: #ce93d8;">
                <option value="LOW" selected>Low (高速・推奨)</option>
                <option value="MEDIUM">Medium (標準バランス)</option>
                <option value="HIGH">High (高精度・じっくり)</option>
            </select>
        </div>
        <button class="btn btn-purple" id="btnRunAI" onclick="runAIPainting()" style="margin-bottom: 0;">✨ Geminiで一括赤塗り（オンライン限定）</button>
    </div>

    <div class="control-group">
        <label>① 抽出する色（スポイト抽出・最大3色）</label>
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <div style="flex: 1; text-align: center;">
                <span id="colorBox1" class="color-preview" style="background: rgb(139, 69, 19);"></span>
                <button class="btn btn-gray" style="padding: 8px; font-size: 0.8em; margin:0;" onclick="setMode('color1')">👆 色1</button>
            </div>
            <div style="flex: 1; text-align: center;">
                <span id="colorBox2" class="color-preview" style="background: #eee;"></span>
                <button class="btn btn-gray" style="padding: 8px; font-size: 0.8em; margin:0;" onclick="setMode('color2')">👆 色2</button>
            </div>
            <div style="flex: 1; text-align: center;">
                <span id="colorBox3" class="color-preview" style="background: #eee;"></span>
                <button class="btn btn-gray" style="padding: 8px; font-size: 0.8em; margin:0;" onclick="setMode('color3')">👆 色3</button>
            </div>
        </div>
        <button class="btn btn-gray" style="background: #e57373; padding: 6px; font-size: 0.8em;" onclick="clearExtraColors()">🗑 色2・色3をリセット</button>
        
        <label style="margin-top: 10px;">② 色の許容範囲 (スライダーで調整)</label>
        <input type="range" id="toleranceSlider" min="10" max="150" value="40" oninput="processColor()">
    </div>

    <div class="control-group">
        <label>③ 測量ポールで縮尺を設定（画面上の両端をタップ）</label>
        <button class="btn btn-orange" id="btnSetScale" onclick="setMode('scale')">📏 ポールの両端を2箇所タップする</button>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <div style="flex: 1;">
                <label>ポールの実寸(m)</label>
                <input type="number" id="poleLength" value="2.0" step="0.1" onchange="calculateVolume()">
            </div>
            <div style="flex: 1;">
                <label>丸太の奥行き(m)</label>
                <input type="number" id="logDepth" value="4.0" step="0.1" onchange="calculateVolume()">
            </div>
        </div>
        
        <div class="toggle-box">
            <label class="toggle-label">
                <input type="checkbox" id="correctionToggle" class="toggle-checkbox" checked onchange="calculateVolume()">
                <span>断面補正（× 4 / 3.141）<br><span class="toggle-desc">※実面積から末口自乗法へ換算</span></span>
            </label>
        </div>
    </div>

    <div class="control-group" style="background: #e1f5fe; border-color: #81d4fa;">
        <label>④ 🎨 不要な赤色を消去 / 補正（消しゴム）</label>
        <div class="toolbar">
            <div class="tool-btn" id="tool-pan" onclick="setMode('pan')">✋ スクロール</div>
            <div class="tool-btn active" id="tool-eraser" onclick="setMode('eraser')">⚪️ 消しゴム</div>
            <div class="tool-btn" id="tool-paint" onclick="setMode('paint')">🔴 書き足し</div>
        </div>
        <label>ブラシの太さ</label>
        <input type="range" id="brushSizeSlider" min="5" max="100" value="30">
        <button class="btn btn-gray" style="background: #607d8b; padding: 8px; margin-bottom: 0;" onclick="resetColorMask()">🔄 抽出を完全リセット</button>
    </div>

</div>

<script>
    // ==========================================
    // ★ API・モデル設定
    // ==========================================
    const PROJECT_NAME = "my-first-project-bjosg";
    const RF_API_KEY = "rf_sRyNyDbysrbVYyp2FNCslDCxdpN2";
    const MODEL_VERSION = 40;
    const MODEL_CANDIDATES = ["gemini-4-hydrogen", "gemini-3.8-flash", "gemini-2.5-flash"];

    window.addEventListener('load', () => {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed!', err));
        }
        const savedKey = localStorage.getItem('gemini_api_key_vol') || localStorage.getItem('gemini_api_key_ai');
        if (savedKey) document.getElementById('geminiApiKey').value = savedKey;
    });

    const imageInputCamera = document.getElementById('imageInputCamera');
    const imageInputFile = document.getElementById('imageInputFile');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusText = document.getElementById('status-text');
    const toleranceSlider = document.getElementById('toleranceSlider');
    const brushSizeSlider = document.getElementById('brushSizeSlider');
    const btnRunAI = document.getElementById('btnRunAI');
    const btnRunRF = document.getElementById('btnRunRF');
    
    let originalImage = null;
    let logModel = null;
    let targetColors = [
        { r: 139, g: 69, b: 19, active: true },
        { r: 0, g: 0, b: 0, active: false },
        { r: 0, g: 0, b: 0, active: false }
    ];
    let currentMode = 'eraser'; 
    let scalePoints = [];
    let pixelsPerMeter = 0;
    let extractedPixelCount = 0;

    let isDrawing = false;
    let extractedMaskCanvas = null; 
    let extractedMaskCtx = null;

    function handleImageUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const maxWidth = 1200;
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                    height = Math.floor(height * (maxWidth / width));
                    width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                originalImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                if (!extractedMaskCanvas) {
                    extractedMaskCanvas = document.createElement('canvas');
                }
                extractedMaskCanvas.width = width;
                extractedMaskCanvas.height = height;
                extractedMaskCtx = extractedMaskCanvas.getContext('2d', { willReadFrequently: true });
                extractedMaskCtx.globalCompositeOperation = 'source-over';
                extractedMaskCtx.clearRect(0, 0, width, height);
                
                statusText.innerText = "2. AI自動赤塗り、またはスポイトで色を抽出してください";
                statusText.style.color = "#1565c0";
                
                extractedPixelCount = 0;
                scalePoints = [];
                calculateVolume();
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
        e.target.value = '';
    }
    
    imageInputCamera.addEventListener('change', handleImageUpload);
    imageInputFile.addEventListener('change', handleImageUpload);

    // クリーンな元画像のCanvasを取得（緑のスケール線などがAIに混入しないようにする）
    function getCleanImageCanvas() {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        tempCanvas.getContext('2d').putImageData(originalImage, 0, 0);
        return tempCanvas;
    }

    // ==========================================
    // ★ オプションA: Roboflow 自動赤塗り（内部上限1000本）
    // ==========================================
    function applyRoboflowConfig() {
        if (!logModel) return;
        const selectedThreshold = parseFloat(document.getElementById('rfThresholdSelect')?.value) || 0.40;
        try {
            logModel.configure({
                threshold: selectedThreshold,
                overlap: 0.50,
                max_objects: 1000
            });
        } catch (e) {
            console.log("Roboflow configure warning:", e);
        }
    }

    async function loadRoboflowModel() {
        const btn = document.getElementById('btnLoadModel');
        btn.disabled = true;
        btn.innerText = "⏳ モデル読込中...";
        statusText.innerText = "Roboflowモデルをダウンロードしています...";
        
        try {
            const rf = await window.roboflow.auth({ publishable_key: RF_API_KEY });
            logModel = await rf.load({ model: PROJECT_NAME, version: MODEL_VERSION });
            applyRoboflowConfig();
            
            btn.innerText = "✅ モデル読込完了";
            btn.style.background = "#388e3c"; 
            statusText.innerText = "モデルの準備が完了しました。オフラインでも高速赤塗りが可能です。";
            statusText.style.color = "#2e7d32";
        } catch (error) {
            alert("モデル読込失敗: " + error.message);
            statusText.innerText = "モデル読込エラーが発生しました";
            btn.disabled = false;
            btn.innerText = "📥 認識モデル読込（要オンライン環境）";
        }
    }

    async function runRoboflowPainting() {
        if (!originalImage) return alert("先に写真を読み込んでください");
        
        btnRunRF.disabled = true;
        btnRunRF.innerText = "⏳ 解析中...";
        statusText.innerText = "Roboflowで丸太を高速検出しています...";
        statusText.style.color = "#2e7d32";

        try {
            if (!logModel) {
                const rf = await window.roboflow.auth({ publishable_key: RF_API_KEY });
                logModel = await rf.load({ model: PROJECT_NAME, version: MODEL_VERSION });
                const loadBtn = document.getElementById('btnLoadModel');
                loadBtn.innerText = "✅ モデル読込完了";
                loadBtn.style.background = "#388e3c";
                loadBtn.disabled = true;
            }

            applyRoboflowConfig();

            const cleanCanvas = getCleanImageCanvas();
            const predictions = await logModel.detect(cleanCanvas);

            // ★重要修正：消しゴムの「destination-out」を解除して確実に赤塗りする
            extractedMaskCtx.globalCompositeOperation = 'source-over';
            extractedMaskCtx.clearRect(0, 0, extractedMaskCanvas.width, extractedMaskCanvas.height);
            extractedMaskCtx.fillStyle = 'rgba(255, 0, 0, 1)';

            predictions.forEach(p => {
                const cx = p.bbox.x;
                const cy = p.bbox.y;
                const radiusX = p.bbox.width / 2;
                const radiusY = p.bbox.height / 2;
                if (radiusX > 0 && radiusY > 0) {
                    extractedMaskCtx.beginPath();
                    extractedMaskCtx.ellipse(cx, cy, radiusX, radiusY, 0, 0, 2 * Math.PI);
                    extractedMaskCtx.fill();
                }
            });

            setMode('eraser');
            finalComposite();

            statusText.innerText = `✅ Roboflowが ${predictions.length} 本の丸太を赤塗りしました！消しゴムで補正してください。`;
            statusText.style.color = "#2e7d32";

        } catch (error) {
            console.error(error);
            alert("Roboflow解析エラー: " + error.message);
            statusText.innerText = "エラーが発生しました: " + error.message;
            statusText.style.color = "#d32f2f";
        } finally {
            btnRunRF.disabled = false;
            btnRunRF.innerText = "⚡ Roboflowで一括赤塗り";
        }
    }

    // ==========================================
    // ★ オプションB: Gemini 4 (Hydrogen) 自動赤塗り
    // ==========================================
    async function fetchWithTimeout(url, options, timeoutMs = 120000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
            return await fetch(url, { ...options, signal: controller.signal });
        } finally {
            clearTimeout(timer);
        }
    }

    async function callGeminiWithFallback(apiKey, basePayload, onStatusUpdate) {
        let lastErrorMsg = "";
        const selectedThinkingLevel = document.getElementById('thinkingLevelSelect')?.value || "LOW";

        for (const modelName of MODEL_CANDIDATES) {
            if (onStatusUpdate) onStatusUpdate(`${modelName} (${selectedThinkingLevel})`);
            const supportsThinking = modelName.startsWith("gemini-4") || modelName.startsWith("gemini-3");
            const payloadWithThinking = JSON.parse(JSON.stringify(basePayload));
            if (supportsThinking) {
                payloadWithThinking.generationConfig = {
                    ...(payloadWithThinking.generationConfig || {}),
                    thinkingConfig: { thinkingLevel: selectedThinkingLevel }
                };
            }
            try {
                let response = await fetchWithTimeout(
                    `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
                    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payloadWithThinking) },
                    120000
                );
                let data = await response.json();
                if (data.error && response.status === 400 && supportsThinking) {
                    response = await fetchWithTimeout(
                        `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
                        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(basePayload) },
                        120000
                    );
                    data = await response.json();
                }
                if (data.error) {
                    lastErrorMsg = `[${modelName}] ${data.error.message}`;
                    continue;
                }
                if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                    const parts = data.candidates[0].content.parts || [];
                    const answerPart = parts.find(p => typeof p.text === 'string' && !p.thought) || parts.find(p => typeof p.text === 'string');
                    if (answerPart) {
                        return { text: answerPart.text, usedModel: `${modelName} [思考:${selectedThinkingLevel}]` };
                    }
                }
            } catch (err) {
                lastErrorMsg = `[${modelName}] ${err.name === 'AbortError' ? 'タイムアウト(120秒超過)' : err.message}`;
            }
        }
        throw new Error(lastErrorMsg || "AIモデルでの通信に失敗しました。APIキーをご確認ください。");
    }

    async function runAIPainting() {
        if (!originalImage) return alert("先に写真を読み込んでください");
        const apiKey = document.getElementById('geminiApiKey').value.trim();
        if (!apiKey) return alert("Gemini APIキーを入力してください");
        
        localStorage.setItem('gemini_api_key_vol', apiKey);
        
        btnRunAI.disabled = true;
        btnRunAI.innerText = "⏳ Geminiが丸太を検出中...";
        statusText.style.color = "#673ab7";

        try {
            const cleanCanvas = getCleanImageCanvas();
            const base64Image = cleanCanvas.toDataURL("image/jpeg", 0.8).split(',')[1];

            const promptText = `
                添付された画像内の「すべての丸太の断面（木口）」を検出し、それぞれのバウンディングボックス（囲み枠）を以下のJSON形式で出力してください。
                【重要】
                ・座標（ymin, xmin, ymax, xmax）は画像の幅と高さを1.0とした割合（0.0〜1.0の数値）で記述してください。
                ・Markdownブロック（\`\`\`json など）は絶対に含めず、純粋なJSON文字列のみを出力してください。
                {
                  "logs": [
                    {"ymin": 0.123, "xmin": 0.456, "ymax": 0.234, "xmax": 0.567}
                  ]
                }
            `;

            const payload = {
                contents: [{ parts: [{ text: promptText }, { inlineData: { data: base64Image, mimeType: "image/jpeg" } }] }],
                generationConfig: { response_mime_type: "application/json" }
            };

            const res = await callGeminiWithFallback(apiKey, payload, (modelStatus) => {
                statusText.innerText = `🤖 ${modelStatus} で丸太の座標を計算中...`;
            });

            const cleanText = res.text.replace(/```json/g, '').replace(/```/g, '').trim();
            const jsonResponse = JSON.parse(cleanText);

            if (!jsonResponse || !Array.isArray(jsonResponse.logs)) {
                throw new Error("AIから正しい座標データが返ってきませんでした。");
            }

            // ★重要修正：消しゴムの「destination-out」を解除して確実に赤塗りする
            extractedMaskCtx.globalCompositeOperation = 'source-over';
            extractedMaskCtx.clearRect(0, 0, extractedMaskCanvas.width, extractedMaskCanvas.height);
            extractedMaskCtx.fillStyle = 'rgba(255, 0, 0, 1)';
            
            const w = canvas.width;
            const h = canvas.height;
            let paintedCount = 0;

            jsonResponse.logs.forEach(log => {
                let ymin, xmin, ymax, xmax;
                if (Array.isArray(log) && log.length >= 4) {
                    [ymin, xmin, ymax, xmax] = log.map(Number);
                } else if (log && typeof log === 'object') {
                    ymin = Number(log.ymin ?? log.y_min ?? (Array.isArray(log.box_2d) ? log.box_2d[0] : NaN));
                    xmin = Number(log.xmin ?? log.x_min ?? (Array.isArray(log.box_2d) ? log.box_2d[1] : NaN));
                    ymax = Number(log.ymax ?? log.y_max ?? (Array.isArray(log.box_2d) ? log.box_2d[2] : NaN));
                    xmax = Number(log.xmax ?? log.x_max ?? (Array.isArray(log.box_2d) ? log.box_2d[3] : NaN));
                }

                if ([ymin, xmin, ymax, xmax].some(v => isNaN(v))) return;

                // AIが0〜1000スケールで返した場合の自動正規化
                if (ymax > 1.5 || xmax > 1.5) {
                    ymin /= 1000; xmin /= 1000; ymax /= 1000; xmax /= 1000;
                }

                const y = ymin * h;
                const x = xmin * w;
                const boxH = Math.abs(ymax - ymin) * h;
                const boxW = Math.abs(xmax - xmin) * w;
                
                const cx = x + boxW / 2;
                const cy = y + boxH / 2;
                const radiusX = boxW / 2;
                const radiusY = boxH / 2;
                
                if (radiusX > 0.5 && radiusY > 0.5) {
                    extractedMaskCtx.beginPath();
                    extractedMaskCtx.ellipse(cx, cy, radiusX, radiusY, 0, 0, 2 * Math.PI);
                    extractedMaskCtx.fill();
                    paintedCount++;
                }
            });

            setMode('eraser');
            finalComposite();
            
            statusText.innerText = `✅ ${res.usedModel} が ${paintedCount} 本を赤塗りしました！消しゴムで補正してください。`;
            statusText.style.color = "#2e7d32";

        } catch (error) {
            console.error(error);
            alert('AI通信エラー: ' + error.message);
            statusText.innerText = "エラーが発生しました: " + error.message;
            statusText.style.color = "#d32f2f";
        } finally {
            btnRunAI.disabled = false;
            btnRunAI.innerText = "✨ Geminiで一括赤塗り（オンライン限定）";
        }
    }

    // ==========================================
    // 既存UIとキャンバス操作ロジック
    // ==========================================
    function setMode(mode) {
        if (!originalImage) return alert("先に写真を読み込んでください");
        currentMode = mode;
        
        const tools = ['pan', 'eraser', 'paint'];
        tools.forEach(t => {
            const btn = document.getElementById(`tool-${t}`);
            if (t === mode) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        if (mode.startsWith('color')) {
            const num = mode.replace('color', '');
            statusText.innerText = `👆 画像内の【色${num}】に設定したい丸太をタップしてください`;
            statusText.style.color = "#d32f2f";
        } else if (mode === 'scale') {
            currentMode = 'scale1';
            scalePoints = [];
            statusText.innerText = "📏 測量ポールの【1点目】をタップしてください";
            statusText.style.color = "#e65100";
        } else if (mode === 'eraser' || mode === 'paint') {
            statusText.innerText = "🎨 下のツールで赤色を書き足したり、消したり出来ます。";
            statusText.style.color = "#01579b";
        }
    }

    function clearExtraColors() {
        targetColors[1].active = false;
        targetColors[2].active = false;
        document.getElementById('colorBox2').style.backgroundColor = '#eee';
        document.getElementById('colorBox3').style.backgroundColor = '#eee';
        processColor();
    }

    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX, clientY;
        
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        
        const x = Math.floor((clientX - rect.left) * scaleX);
        const y = Math.floor((clientY - rect.top) * scaleY);
        return {x, y};
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', (e) => {
        if (currentMode === 'eraser' || currentMode === 'paint') {
            e.preventDefault(); 
            startDrawing(e);
        }
    });
    canvas.addEventListener('touchmove', (e) => {
        if (currentMode === 'eraser' || currentMode === 'paint') {
            e.preventDefault();
            draw(e);
        }
    });
    window.addEventListener('touchend', stopDrawing);

    function startDrawing(e) {
        if (currentMode === 'eraser' || currentMode === 'paint') {
            isDrawing = true;
            draw(e); 
        } else if (currentMode.startsWith('color') || currentMode.startsWith('scale')) {
            handleSingleTap(e);
        }
    }

    function stopDrawing() {
        if (isDrawing) {
            isDrawing = false;
            extractedMaskCtx.beginPath(); 
            finalComposite(); 
        }
    }

    function draw(e) {
        if (!isDrawing || !extractedMaskCtx || (!originalImage)) return;
        
        const {x, y} = getCanvasCoords(e);
        const brushSize = parseInt(brushSizeSlider.value);

        extractedMaskCtx.lineWidth = brushSize;
        extractedMaskCtx.lineCap = 'round';

        if (currentMode === 'eraser') {
            extractedMaskCtx.globalCompositeOperation = 'destination-out';
            extractedMaskCtx.strokeStyle = 'rgba(0,0,0,1)'; 
        } else if (currentMode === 'paint') {
            extractedMaskCtx.globalCompositeOperation = 'source-over';
            extractedMaskCtx.strokeStyle = 'rgba(255,0,0,1)';
        } else {
            return;
        }

        extractedMaskCtx.lineTo(x, y);
        extractedMaskCtx.stroke();
        extractedMaskCtx.beginPath();
        extractedMaskCtx.moveTo(x, y);
        
        compositeDuringDrawing(); 
    }

    function handleSingleTap(e) {
        if (!originalImage) return;
        
        const {x, y} = getCanvasCoords(e);

        if (currentMode.startsWith('color')) {
            const indexColor = parseInt(currentMode.replace('color', '')) - 1;
            const pixel = originalImage.data;
            const index = (y * canvas.width + x) * 4;
            
            targetColors[indexColor] = { r: pixel[index], g: pixel[index+1], b: pixel[index+2], active: true };
            document.getElementById(`colorBox${indexColor+1}`).style.backgroundColor = `rgb(${targetColors[indexColor].r},${targetColors[indexColor].g},${targetColors[indexColor].b})`;
            
            currentMode = 'eraser'; 
            statusText.innerText = "🎨 他の色を追加するか、スライダー調整後、消しゴムで補正してください。";
            statusText.style.color = "#01579b";
            setMode('eraser');
            processColor(); 

        } else if (currentMode === 'scale1') {
            scalePoints.push({x, y});
            drawPoint(x, y, '#00ff00');
            currentMode = 'scale2';
            statusText.innerText = "📏 測量ポールの【2点目】をタップしてください";
            
        } else if (currentMode === 'scale2') {
            scalePoints.push({x, y});
            drawPoint(x, y, '#00ff00');
            drawLine(scalePoints[0], scalePoints[1], '#00ff00');
            
            const dx = scalePoints[1].x - scalePoints[0].x;
            const dy = scalePoints[1].y - scalePoints[0].y;
            const pixelDist = Math.sqrt(dx*dx + dy*dy);
            
            const realPoleMeters = parseFloat(document.getElementById('poleLength').value);
            if (realPoleMeters <= 0) { alert("正しいポールの実寸を入力してください"); pixelsPerMeter = 0; return; }
            pixelsPerMeter = pixelDist / realPoleMeters; 
            
            currentMode = 'eraser';
            statusText.innerText = "✅ スケール完了。不要な赤色は消しゴムで消してください。";
            statusText.style.color = "#01579b";
            setMode('eraser');
            finalComposite(); 
        }
    }

    function resetColorMask() {
        if (!originalImage) return;
        if (confirm("現在の抽出結果とお絵描きを完全にリセットしますか？")) {
            extractedMaskCtx.globalCompositeOperation = 'source-over';
            extractedMaskCtx.clearRect(0, 0, extractedMaskCanvas.width, extractedMaskCanvas.height);
            finalComposite(); 
            statusText.innerText = "リセットしました。再度AIを利用するかスポイトで色を抽出してください。";
        }
    }

    function processColor() {
        if (!originalImage || !extractedMaskCtx) return;
        
        const tolerance = parseInt(toleranceSlider.value);
        const data = originalImage.data;
        
        extractedMaskCtx.globalCompositeOperation = 'source-over';
        extractedMaskCtx.clearRect(0, 0, extractedMaskCanvas.width, extractedMaskCanvas.height);
        const maskData = new ImageData(canvas.width, canvas.height);
        const md = maskData.data;

        for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i+1];
            const b = data[i+2];
            
            let isMatch = false;
            
            for (let c = 0; c < 3; c++) {
                if (!targetColors[c].active) continue;
                
                const distance = Math.sqrt(
                    Math.pow(r - targetColors[c].r, 2) + 
                    Math.pow(g - targetColors[c].g, 2) + 
                    Math.pow(b - targetColors[c].b, 2)
                );

                if (distance < tolerance) {
                    isMatch = true;
                    break;
                }
            }

            if (isMatch) {
                md[i] = 255;   // R
                md[i+1] = 0;   // G
                md[i+2] = 0;   // B
                md[i+3] = 255; // Alpha
            }
        }
        extractedMaskCtx.putImageData(maskData, 0, 0);
        finalComposite(); 
    }

    function compositeDuringDrawing() {
        if (!originalImage) return;
        ctx.putImageData(originalImage, 0, 0);
        ctx.save();
        ctx.globalAlpha = 0.6; 
        ctx.fillStyle = 'red'; 
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(extractedMaskCanvas, 0, 0);
        ctx.restore();
    }

    function finalComposite() {
        if (!originalImage || !extractedMaskCtx) return;

        compositeDuringDrawing();
        
        const maskData = extractedMaskCtx.getImageData(0, 0, canvas.width, canvas.height).data;
        extractedPixelCount = 0;
        for (let i = 3; i < maskData.length; i += 4) {
            if (maskData[i] > 128) { 
                extractedPixelCount++;
            }
        }
        
        if (scalePoints.length === 2) {
            drawPoint(scalePoints[0].x, scalePoints[0].y, '#00ff00');
            drawPoint(scalePoints[1].x, scalePoints[1].y, '#00ff00');
            drawLine(scalePoints[0], scalePoints[1], '#00ff00');
        }
        
        document.getElementById('pixelCount').innerText = extractedPixelCount.toLocaleString();
        calculateVolume();
    }

    function calculateVolume() {
        if (pixelsPerMeter === 0 || extractedPixelCount === 0) {
             document.getElementById('resultArea').innerText = "0.000";
             document.getElementById('resultVolume').innerText = "0.000";
             return;
        }
        
        const meterPerPixel = 1 / pixelsPerMeter;
        const areaPerPixel = meterPerPixel * meterPerPixel;
        const totalAreaM2 = extractedPixelCount * areaPerPixel;
        
        const depthM = parseFloat(document.getElementById('logDepth').value) || 4.0;
        let volumeM3 = totalAreaM2 * depthM;
        
        if (document.getElementById('correctionToggle').checked) {
            volumeM3 = volumeM3 * (4 / 3.141);
        }
        
        document.getElementById('resultArea').innerText = totalAreaM2.toFixed(3);
        document.getElementById('resultVolume').innerText = volumeM3.toFixed(3);
    }

    function drawPoint(x, y, color) {
        ctx.beginPath();
        ctx.arc(x, y, 8, 0, 2 * Math.PI);
        ctx.fillStyle = color; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
    }
    
    function drawLine(p1, p2, color) {
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.stroke();
    }
</script>
