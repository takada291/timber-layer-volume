<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>層積検尺</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b4513">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="層積検尺">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- ONNX Runtime Web (WASM版 / MITライセンス / 初回読込時にSWでオフラインキャッシュ) -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.wasm.min.js"></script>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WXBP6CPKLP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WXBP6CPKLP');
    </script>
    
    <style>
        body { font-family: -apple-system, sans-serif; padding: 10px; background: #fdf5e6; color: #333; margin: 0; padding-bottom: 40px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .header { border-bottom: 2px solid #8b4513; margin-bottom: 10px; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        h2 { margin: 0; font-size: 1.2em; color: #5d4037; }
        
        .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; color: white; margin-bottom: 10px; cursor: pointer; text-align: center; box-sizing: border-box; touch-action: manipulation; }
        .btn-blue { background: #1565c0; }
        .btn-green { background: #2e7d32; }
        .btn-orange { background: #e65100; }
        .btn-gray { background: #757575; }
        .btn-teal { background: #00897b; }
        .btn:disabled { background: #bdbdbd !important; cursor: not-allowed; }

        #canvas-container { position: relative; width: 100%; max-height: 62vh; overflow: hidden; border: 1px solid #ccc; background: #000; border-radius: 8px; margin-bottom: 10px; text-align: center; }
        canvas { max-width: 100%; height: auto; display: block; margin: 0 auto; touch-action: none; cursor: pointer; }
        
        .control-group { margin-bottom: 15px; background: #fff3e0; padding: 12px; border-radius: 8px; border: 1px solid #ffcc80; }
        .control-group.rf-group { background: #e8f5e9; border-color: #81c784; margin-bottom: 0; }
        
        label { font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px; color: #5d4037; }
        input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; background: white; }
        
        .input-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .input-row label { margin-bottom: 0; width: 38%; }
        .input-row select, .input-row input { width: 60%; margin-bottom: 0; font-weight: bold; }

        .result-box { background: #e8f5e9; border: 2px solid #4caf50; padding: 15px; border-radius: 8px; text-align: center; font-size: 1.2em; font-weight: bold; color: #1b5e20; margin-bottom: 15px; }
        #status-text { color: #d32f2f; font-weight: bold; font-size: 0.92em; margin-bottom: 10px; text-align: center; line-height: 1.4; }
        
        .toggle-box { margin-top: 10px; padding: 10px; background: #fff; border-radius: 6px; border: 1px solid #ccc; text-align: left; }
        .toggle-label { display: flex; align-items: center; margin: 0; color: #1565c0; cursor: pointer; font-weight: bold; font-size: 0.9em; }
        .toggle-checkbox { width: auto; margin: 0 10px 0 0; transform: scale(1.3); }
        .toggle-desc { font-size: 0.8em; color: #666; font-weight: normal; }

        .photo-buttons { display: flex; gap: 10px; margin-bottom: 10px; }
        .photo-buttons label { flex: 1; margin-bottom: 0; }

        /* 十字マーカー確定バー */
        #crosshair-action-bar { display: none; background: #fff3e0; border: 2px solid #ffb74d; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
        .action-bar-btns { display: flex; gap: 8px; }

        /* ポップアップモーダル用スタイル */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); z-index: 99; overflow-y: auto; }
        .modal-content { background: white; margin: 8% auto; padding: 18px; width: 90%; max-width: 400px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); box-sizing: border-box; }
        .modal-section { background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 12px; margin-bottom: 12px; text-align: left; }
        .quick-btns { display: flex; gap: 6px; margin-top: 6px; margin-bottom: 12px; }
        .quick-btn { flex: 1; padding: 7px 0; background: #fff; border: 1px solid #bcaaa4; border-radius: 5px; font-weight: bold; font-size: 0.85rem; color: #5d4037; cursor: pointer; }
        .quick-btn.active-val { background: #8d6e63; color: white; border-color: #5d4037; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>層積検尺 v3.0</h2>
    </div>
    
    <div class="photo-buttons">
        <label class="btn btn-blue">
            📸 写真を撮る
            <input type="file" id="imageInputCamera" accept="image/*" capture="environment" style="display: none;">
        </label>
        <label class="btn btn-blue" style="background-color: #0288d1;">
            🖼️ 写真を選ぶ
            <input type="file" id="imageInputFile" accept="image/*" style="display: none;">
        </label>
    </div>

    <div id="status-text">1. 写真を読み込んでください</div>

    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <!-- 十字マーカー調整・確定バー（AI赤塗り後に出現） -->
    <div id="crosshair-action-bar">
        <div style="font-size: 0.85em; font-weight: bold; color: #e65100; margin-bottom: 8px; text-align: center;">
            👆 画面上の2つの「＋」を指でポールの両端へ移動してください
        </div>
        <div class="action-bar-btns">
            <button class="btn btn-gray" style="flex: 0.45; margin-bottom: 0; padding: 10px 6px; font-size: 0.85rem;" onclick="openScaleModal()">⚙️ 寸法設定</button>
            <button class="btn btn-orange" style="flex: 1; margin-bottom: 0; padding: 10px;" onclick="confirmCrosshairScale()">✅ ポール位置を確定して計算</button>
        </div>
    </div>

    <div class="result-box">
        概算材積: <span id="resultVolume" style="font-size: 1.5em; color: #d32f2f;">0.000</span> m³
        <div style="font-size: 0.6em; color: #555; margin-top: 5px;">
            検知: <span id="resultCount">0</span> 本 / 面積: <span id="resultArea">0.000</span> m² (<span id="pixelCount">0</span> px)
        </div>
    </div>

    <!-- ローカルAIモデルによる高速自動赤塗りエリア（完全オフライン・上限2000本） -->
    <div class="control-group rf-group">
        <label style="color: #2e7d32;">🧠 AIによる自動赤塗り（オフライン高速）</label>
        <button class="btn btn-teal" id="btnLoadModel" onclick="loadOnnxModel()">📥 認識モデル読込（事前キャッシュ用）</button>
        <div class="input-row">
            <label style="color: #2e7d32;">🎯 検出感度</label>
            <select id="rfThresholdSelect" style="border-color: #81c784;">
                <option value="0.25">甘め・多めに検出 (25%以上)</option>
                <option value="0.40" selected>標準バランス (40%以上)</option>
                <option value="0.60">厳しめ・確実のみ (60%以上)</option>
            </select>
        </div>
        <button class="btn btn-green" id="btnRunAI" onclick="runOnnxPainting()" style="margin-bottom: 0;">⚡ AIで一括赤塗り</button>
    </div>
</div>

<!-- AI赤塗り完了後に自動表示される「ポール実寸・丸太奥行・断面補正」設定モーダル -->
<div id="scaleSettingsModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; margin-bottom:12px; color:#e65100;">📏 寸法・断面補正の設定</h3>
        <p style="font-size:0.85em; color:#555; margin-top:0; margin-bottom:12px;">
            AIで <b id="modalDetectedCount" style="color:#2e7d32;">0</b> 本の丸太を赤塗りしました。<br>測定条件を確認して「設定OK」を押してください。
        </p>

        <div class="modal-section">
            <!-- ポールの実寸 -->
            <div class="input-row" style="margin-bottom: 4px;">
                <label>📏 ポール実寸(m)</label>
                <input type="number" id="poleLength" value="2.0" step="0.1" min="0.1" oninput="syncQuickButtons()">
            </div>
            <div class="quick-btns" id="poleQuickBtns">
                <button type="button" class="quick-btn" onclick="setQuickPole(1.0)">1.0m</button>
                <button type="button" class="quick-btn" onclick="setQuickPole(1.5)">1.5m</button>
                <button type="button" class="quick-btn active-val" onclick="setQuickPole(2.0)">2.0m</button>
                <button type="button" class="quick-btn" onclick="setQuickPole(3.0)">3.0m</button>
            </div>

            <!-- 丸太の奥行き（材長） -->
            <div class="input-row" style="margin-bottom: 4px;">
                <label>🌲 丸太の奥行(m)</label>
                <input type="number" id="logDepth" value="4.0" step="0.1" min="0.1" oninput="syncQuickButtons()">
            </div>
            <div class="quick-btns" id="depthQuickBtns" style="margin-bottom: 8px;">
                <button type="button" class="quick-btn" onclick="setQuickDepth(2.0)">2m</button>
                <button type="button" class="quick-btn" onclick="setQuickDepth(3.0)">3m</button>
                <button type="button" class="quick-btn active-val" onclick="setQuickDepth(4.0)">4m</button>
                <button type="button" class="quick-btn" onclick="setQuickDepth(6.0)">6m</button>
            </div>

            <!-- 断面補正 -->
            <div class="toggle-box">
                <label class="toggle-label">
                    <input type="checkbox" id="correctionToggle" class="toggle-checkbox" checked>
                    <span>断面補正（× 4 / 3.141）<br><span class="toggle-desc">※実面積から末口自乗法へ換算</span></span>
                </label>
            </div>
        </div>

        <button class="btn btn-green" style="margin-bottom:0; font-size:1.05rem; padding:14px;" onclick="confirmScaleModal()">
            設定OK（十字マーカーでポール合わせ）
        </button>
    </div>
</div>

<!-- 保存プレビューモーダル（日時・位置情報・検知本数・断面積・概算材積を左下に合成） -->
<div id="savePreviewModal" class="modal">
    <div class="modal-content" style="margin: 5% auto;">
        <h3 style="margin-top:0; color:#1565c0;">📸 保存プレビュー</h3>
        <p style="font-size:0.8em; color:#666;">撮影日時・GPS・検知本数・断面積・概算材積付き</p>
        <img id="previewImg" style="width:100%; border-radius:8px; border:2px solid #ccc; margin-bottom:10px;">
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn btn-gray" style="flex:1; padding:10px; margin-bottom:0;" onclick="closeSaveModal()">閉じる</button>
            <button class="btn btn-orange" style="flex:1; padding:10px; margin-bottom:0;" onclick="downloadImage()">💾 共有 / 保存</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // ローカルONNX推論設定（完全オフライン・上限2000本）
    // ==========================================
    const ONNX_MODEL_URL = './weights.onnx';
    const MODEL_INPUT_SIZE = 640;
    const IOU_THRESHOLD = 0.50;
    const MAX_OBJECTS = 2000;
    const ORT_WASM_CDN = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/';
    const LAST_LAYER_PARAMS_KEY = "timber_layer_last_params";

    window.addEventListener('load', () => {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed!', err));
        }
        loadLastLayerParams();
    });

    const imageInputCamera = document.getElementById('imageInputCamera');
    const imageInputFile = document.getElementById('imageInputFile');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusText = document.getElementById('status-text');
    const btnRunAI = document.getElementById('btnRunAI');
    const actionBar = document.getElementById('crosshair-action-bar');
    
    let originalImage = null;
    let ortSession = null;
    let prepCanvas = null;
    let extractedMaskCanvas = null; 
    let extractedMaskCtx = null;
    let extractedPixelCount = 0;
    let detectedLogCount = 0;

    // 2つの十字マーカー座標と計算結果保持用変数
    let crosshairs = [];
    let showCrosshairs = false;
    let isScaleConfirmed = false;
    let draggingIndex = -1;
    let pixelsPerMeter = 0;
    let currentAreaM2 = 0;
    let currentVolumeM3 = 0;
    let previewDataUrl = null;

    // ==========================================
    // クイックボタン＆前回設定の記憶処理
    // ==========================================
    function setQuickPole(val) {
        document.getElementById('poleLength').value = val;
        syncQuickButtons();
    }

    function setQuickDepth(val) {
        document.getElementById('logDepth').value = val;
        syncQuickButtons();
    }

    function syncQuickButtons() {
        const pVal = parseFloat(document.getElementById('poleLength').value);
        document.querySelectorAll('#poleQuickBtns .quick-btn').forEach(btn => {
            btn.classList.toggle('active-val', parseFloat(btn.innerText) === pVal);
        });
        const dVal = parseFloat(document.getElementById('logDepth').value);
        document.querySelectorAll('#depthQuickBtns .quick-btn').forEach(btn => {
            btn.classList.toggle('active-val', parseFloat(btn.innerText) === dVal);
        });
    }

    function saveLastLayerParams() {
        localStorage.setItem(LAST_LAYER_PARAMS_KEY, JSON.stringify({
            pole: document.getElementById('poleLength').value,
            depth: document.getElementById('logDepth').value,
            corr: document.getElementById('correctionToggle').checked
        }));
    }

    function loadLastLayerParams() {
        try {
            const saved = JSON.parse(localStorage.getItem(LAST_LAYER_PARAMS_KEY) || 'null');
            if (!saved) return;
            if (saved.pole) document.getElementById('poleLength').value = saved.pole;
            if (saved.depth) document.getElementById('logDepth').value = saved.depth;
            if (typeof saved.corr === 'boolean') document.getElementById('correctionToggle').checked = saved.corr;
            syncQuickButtons();
        } catch (e) {
            console.log('Param load skip', e);
        }
    }

    // ==========================================
    // 画像読み込み処理
    // ==========================================
    function handleImageUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const maxWidth = 1200;
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                    height = Math.floor(height * (maxWidth / width));
                    width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, width, height);
                originalImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                if (!extractedMaskCanvas) {
                    extractedMaskCanvas = document.createElement('canvas');
                }
                extractedMaskCanvas.width = width;
                extractedMaskCanvas.height = height;
                extractedMaskCtx = extractedMaskCanvas.getContext('2d', { willReadFrequently: true });
                extractedMaskCtx.clearRect(0, 0, width, height);
                
                // 状態リセット
                extractedPixelCount = 0;
                detectedLogCount = 0;
                pixelsPerMeter = 0;
                crosshairs = [];
                showCrosshairs = false;
                isScaleConfirmed = false;
                actionBar.style.display = 'none';
                document.getElementById('resultCount').innerText = "0";
                document.getElementById('pixelCount').innerText = "0";
                calculateVolume();
                
                statusText.innerText = "2. 「AIで一括赤塗り」を実行してください";
                statusText.style.color = "#1565c0";
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
        e.target.value = '';
    }
    
    imageInputCamera.addEventListener('change', handleImageUpload);
    imageInputFile.addEventListener('change', handleImageUpload);

    function getCleanImageCanvas() {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        tempCanvas.getContext('2d').putImageData(originalImage, 0, 0);
        return tempCanvas;
    }

    // ==========================================
    // ONNX Runtime Web ローカル推論エンジン（YOLOv8n / 上限2000本）
    // ==========================================
    async function ensureOnnxSession() {
        if (ortSession) return ortSession;
        if (typeof ort === 'undefined') {
            throw new Error("推論エンジンが読み込まれていません。初回はオンライン環境でページを開いてください。");
        }

        ort.env.wasm.wasmPaths = ORT_WASM_CDN;
        ort.env.wasm.numThreads = 1;
        ort.env.wasm.simd = true;

        ortSession = await ort.InferenceSession.create(ONNX_MODEL_URL, {
            executionProviders: ['wasm'],
            graphOptimizationLevel: 'all'
        });
        return ortSession;
    }

    async function loadOnnxModel() {
        const btn = document.getElementById('btnLoadModel');
        btn.disabled = true;
        btn.innerText = "⏳ 内蔵モデル読込中...";
        statusText.innerText = "リポジトリ内の認識モデルを読み込んでいます...";
        statusText.style.color = "#00897b";
        
        try {
            const t0 = performance.now();
            await ensureOnnxSession();
            const sec = ((performance.now() - t0) / 1000).toFixed(2);
            
            btn.innerText = "✅ 認識モデル準備完了";
            btn.style.background = "#388e3c"; 
            statusText.innerText = `認識モデルの準備が完了しました（${sec}秒）。オフラインでも高速赤塗りが可能です。`;
            statusText.style.color = "#2e7d32";
        } catch (error) {
            console.error(error);
            alert("モデル読込失敗: " + error.message);
            statusText.innerText = "モデル読込エラーが発生しました: " + error.message;
            statusText.style.color = "#d32f2f";
            btn.disabled = false;
            btn.innerText = "📥 認識モデル読込（事前キャッシュ用）";
        }
    }

    // V40学習時と同じ Stretch 640x640 -> NCHW FP32 [1, 3, 640, 640] (0.0〜1.0)
    function preprocessImageToTensor(srcCanvas) {
        if (!prepCanvas) {
            prepCanvas = document.createElement('canvas');
            prepCanvas.width = MODEL_INPUT_SIZE;
            prepCanvas.height = MODEL_INPUT_SIZE;
        }
        const prepCtx = prepCanvas.getContext('2d', { willReadFrequently: true });
        prepCtx.imageSmoothingEnabled = true;
        prepCtx.imageSmoothingQuality = 'high';
        prepCtx.drawImage(srcCanvas, 0, 0, MODEL_INPUT_SIZE, MODEL_INPUT_SIZE);

        const imgData = prepCtx.getImageData(0, 0, MODEL_INPUT_SIZE, MODEL_INPUT_SIZE).data;
        const area = MODEL_INPUT_SIZE * MODEL_INPUT_SIZE;
        const floatData = new Float32Array(3 * area);

        for (let i = 0; i < area; i++) {
            const p = i << 2;
            floatData[i] = imgData[p] / 255.0;
            floatData[area + i] = imgData[p + 1] / 255.0;
            floatData[2 * area + i] = imgData[p + 2] / 255.0;
        }
        return new ort.Tensor('float32', floatData, [1, 3, MODEL_INPUT_SIZE, MODEL_INPUT_SIZE]);
    }

    function calcIoU(a, b) {
        const interX1 = Math.max(a.x1, b.x1);
        const interY1 = Math.max(a.y1, b.y1);
        const interX2 = Math.min(a.x2, b.x2);
        const interY2 = Math.min(a.y2, b.y2);
        const interW = Math.max(0, interX2 - interX1);
        const interH = Math.max(0, interY2 - interY1);
        const interArea = interW * interH;
        if (interArea <= 0) return 0;
        const areaA = (a.x2 - a.x1) * (a.y2 - a.y1);
        const areaB = (b.x2 - b.x1) * (b.y2 - b.y1);
        return interArea / (areaA + areaB - interArea + 1e-6);
    }

    // YOLOv8出力テンソル [1, 5, 8400] (または [1, 8400, 5]) をデコード＆NMS
    function postprocessYoloOutput(outputTensor, imgW, imgH, confThreshold) {
        const data = outputTensor.data;
        const dims = outputTensor.dims;
        const candidates = [];

        const isChannelFirst = (dims.length === 3 && dims[1] <= dims[2]);
        const numProps = isChannelFirst ? dims[1] : dims[2];
        const numAnchors = isChannelFirst ? dims[2] : dims[1];
        const numClasses = numProps - 4;

        let maxCoord = 0;

        for (let i = 0; i < numAnchors; i++) {
            let bestScore = 0;
            if (isChannelFirst) {
                for (let c = 0; c < numClasses; c++) {
                    const s = data[(4 + c) * numAnchors + i];
                    if (s > bestScore) bestScore = s;
                }
            } else {
                const offset = i * numProps;
                for (let c = 0; c < numClasses; c++) {
                    const s = data[offset + 4 + c];
                    if (s > bestScore) bestScore = s;
                }
            }

            if (bestScore < confThreshold) continue;

            let cx, cy, bw, bh;
            if (isChannelFirst) {
                cx = data[i];
                cy = data[numAnchors + i];
                bw = data[2 * numAnchors + i];
                bh = data[3 * numAnchors + i];
            } else {
                const offset = i * numProps;
                cx = data[offset];
                cy = data[offset + 1];
                bw = data[offset + 2];
                bh = data[offset + 3];
            }

            if (cx > maxCoord) maxCoord = cx;
            if (cy > maxCoord) maxCoord = cy;

            candidates.push({ cx, cy, bw, bh, score: bestScore });
        }

        const coordScale = (maxCoord > 0 && maxCoord <= 2.0) ? MODEL_INPUT_SIZE : 1.0;
        const scaleX = imgW / MODEL_INPUT_SIZE;
        const scaleY = imgH / MODEL_INPUT_SIZE;

        const boxes = candidates.map(c => {
            const cx = c.cx * coordScale;
            const cy = c.cy * coordScale;
            const bw = c.bw * coordScale;
            const bh = c.bh * coordScale;
            const x1 = Math.max(0, (cx - bw / 2) * scaleX);
            const y1 = Math.max(0, (cy - bh / 2) * scaleY);
            const x2 = Math.min(imgW, (cx + bw / 2) * scaleX);
            const y2 = Math.min(imgH, (cy + bh / 2) * scaleY);
            return { x1, y1, x2, y2, score: c.score };
        }).filter(b => (b.x2 - b.x1) > 2 && (b.y2 - b.y1) > 2);

        boxes.sort((a, b) => b.score - a.score);
        const kept = [];
        for (let i = 0; i < boxes.length; i++) {
            const curr = boxes[i];
            let suppressed = false;
            for (let j = 0; j < kept.length; j++) {
                if (calcIoU(curr, kept[j]) > IOU_THRESHOLD) {
                    suppressed = true;
                    break;
                }
            }
            if (!suppressed) {
                kept.push(curr);
                if (kept.length >= MAX_OBJECTS) break;
            }
        }
        return kept;
    }

    async function runOnnxPainting() {
        if (!originalImage) return alert("先に写真を読み込んでください");
        
        btnRunAI.disabled = true;
        btnRunAI.innerText = "⏳ 解析中...";
        statusText.innerText = "内蔵AIモデルで丸太を高速検出しています...";
        statusText.style.color = "#2e7d32";

        let inputTensor = null;
        let results = null;
        try {
            const tStart = performance.now();
            if (!ortSession) {
                await ensureOnnxSession();
                const loadBtn = document.getElementById('btnLoadModel');
                loadBtn.innerText = "✅ 認識モデル準備完了";
                loadBtn.style.background = "#388e3c";
                loadBtn.disabled = true;
            }

            const selectedThreshold = parseFloat(document.getElementById('rfThresholdSelect')?.value) || 0.40;
            const cleanCanvas = getCleanImageCanvas();
            inputTensor = preprocessImageToTensor(cleanCanvas);

            const inputName = ortSession.inputNames[0] || 'images';
            const outputName = ortSession.outputNames[0] || 'output0';
            results = await ortSession.run({ [inputName]: inputTensor });
            const outputTensor = results[outputName];

            const detections = postprocessYoloOutput(outputTensor, canvas.width, canvas.height, selectedThreshold);
            detectedLogCount = detections.length;

            extractedMaskCtx.globalCompositeOperation = 'source-over';
            extractedMaskCtx.clearRect(0, 0, extractedMaskCanvas.width, extractedMaskCanvas.height);
            extractedMaskCtx.fillStyle = 'rgba(255, 0, 0, 1)';

            detections.forEach(d => {
                const cx = (d.x1 + d.x2) / 2;
                const cy = (d.y1 + d.y2) / 2;
                const radiusX = (d.x2 - d.x1) / 2;
                const radiusY = (d.y2 - d.y1) / 2;
                if (radiusX > 0 && radiusY > 0) {
                    extractedMaskCtx.beginPath();
                    extractedMaskCtx.ellipse(cx, cy, radiusX, radiusY, 0, 0, 2 * Math.PI);
                    extractedMaskCtx.fill();
                }
            });

            // 赤塗りピクセル数と本数を更新
            const maskData = extractedMaskCtx.getImageData(0, 0, canvas.width, canvas.height).data;
            extractedPixelCount = 0;
            for (let i = 3; i < maskData.length; i += 4) {
                if (maskData[i] > 128) extractedPixelCount++;
            }
            const elapsedSec = ((performance.now() - tStart) / 1000).toFixed(2);
            document.getElementById('resultCount').innerText = detectedLogCount.toLocaleString();
            document.getElementById('pixelCount').innerText = extractedPixelCount.toLocaleString();

            renderScene();

            statusText.innerText = `✅ ${detectedLogCount}本を赤塗りしました（${elapsedSec}秒）`;
            statusText.style.color = "#2e7d32";

            // AI赤塗り完了後、自動的に寸法・補正設定ポップアップを表示
            document.getElementById('modalDetectedCount').innerText = detectedLogCount.toLocaleString();
            openScaleModal();

        } catch (error) {
            console.error(error);
            alert("AI解析エラー: " + error.message);
            statusText.innerText = "エラーが発生しました: " + error.message;
            statusText.style.color = "#d32f2f";
        } finally {
            if (inputTensor && typeof inputTensor.dispose === 'function') inputTensor.dispose();
            if (results) {
                Object.values(results).forEach(t => {
                    if (t && typeof t.dispose === 'function') t.dispose();
                });
            }
            btnRunAI.disabled = false;
            btnRunAI.innerText = "⚡ AIで一括赤塗り";
        }
    }

    // ==========================================
    // ポップアップ制御と2つの十字マーカー初期配置
    // ==========================================
    function openScaleModal() {
        syncQuickButtons();
        document.getElementById('scaleSettingsModal').style.display = 'block';
    }

    function confirmScaleModal() {
        const poleVal = parseFloat(document.getElementById('poleLength').value);
        const depthVal = parseFloat(document.getElementById('logDepth').value);
        if (!poleVal || poleVal <= 0) return alert("正しいポールの実寸(m)を入力してください");
        if (!depthVal || depthVal <= 0) return alert("正しい丸太の奥行(m)を入力してください");

        saveLastLayerParams();
        document.getElementById('scaleSettingsModal').style.display = 'none';

        if (crosshairs.length !== 2) {
            crosshairs = [
                { x: Math.round(canvas.width * 0.78), y: Math.round(canvas.height * 0.28) },
                { x: Math.round(canvas.width * 0.78), y: Math.round(canvas.height * 0.75) }
            ];
        }

        showCrosshairs = true;
        actionBar.style.display = 'block';

        if (isScaleConfirmed) {
            confirmCrosshairScale();
        } else {
            renderScene();
            statusText.innerText = `3. ${detectedLogCount}本を赤塗り済み：2つの「＋」をポールの両端へ移動し確定してください`;
            statusText.style.color = "#e65100";
        }
    }

    // ==========================================
    // キャンバス描画（元画像 ＋ 赤塗り ＋ 2つの十字マーカー）
    // ==========================================
    function renderScene() {
        if (!originalImage) return;
        ctx.putImageData(originalImage, 0, 0);

        if (extractedMaskCanvas) {
            ctx.save();
            ctx.globalAlpha = 0.6;
            ctx.drawImage(extractedMaskCanvas, 0, 0);
            ctx.restore();
        }

        if (showCrosshairs && crosshairs.length === 2) {
            const p1 = crosshairs[0];
            const p2 = crosshairs[1];

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = isScaleConfirmed ? '#00e676' : '#ffeb3b';
            ctx.lineWidth = 3;
            if (!isScaleConfirmed) ctx.setLineDash([8, 6]);
            ctx.stroke();
            ctx.restore();

            drawCrosshair(p1.x, p1.y, draggingIndex === 0);
            drawCrosshair(p2.x, p2.y, draggingIndex === 1);
        }
    }

    function drawCrosshair(x, y, isDragging) {
        const arm = isDragging ? Math.max(48, canvas.width * 0.055) : Math.max(36, canvas.width * 0.04);

        ctx.save();

        ctx.beginPath();
        ctx.moveTo(x - arm, y);
        ctx.lineTo(x + arm, y);
        ctx.moveTo(x, y - arm);
        ctx.lineTo(x, y + arm);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x - arm, y);
        ctx.lineTo(x + arm, y);
        ctx.moveTo(x, y - arm);
        ctx.lineTo(x, y + arm);
        ctx.strokeStyle = isDragging ? '#ff6d00' : '#d50000';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(x, y, isDragging ? 14 : 10, 0, 2 * Math.PI);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(x, y, 3, 0, 2 * Math.PI);
        ctx.fillStyle = '#00e676';
        ctx.fill();

        ctx.restore();
    }

    // ==========================================
    // 十字マーカーのタッチ・マウスドラッグ操作
    // ==========================================
    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX, clientY;
        
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        
        const x = Math.max(0, Math.min(canvas.width, Math.floor((clientX - rect.left) * scaleX)));
        const y = Math.max(0, Math.min(canvas.height, Math.floor((clientY - rect.top) * scaleY)));
        return { x, y };
    }

    function handlePointerDown(e) {
        if (!showCrosshairs || crosshairs.length !== 2) return;
        const { x, y } = getCanvasCoords(e);

        const d0 = Math.hypot(x - crosshairs[0].x, y - crosshairs[0].y);
        const d1 = Math.hypot(x - crosshairs[1].x, y - crosshairs[1].y);
        const hitRadius = Math.max(80, canvas.width * 0.12);

        if (d0 <= d1 && d0 < hitRadius) {
            draggingIndex = 0;
        } else if (d1 < d0 && d1 < hitRadius) {
            draggingIndex = 1;
        } else {
            return;
        }

        if (e.cancelable) e.preventDefault();
        isScaleConfirmed = false;
        crosshairs[draggingIndex] = { x, y };
        renderScene();
    }

    function handlePointerMove(e) {
        if (draggingIndex === -1) return;
        if (e.cancelable) e.preventDefault();
        const { x, y } = getCanvasCoords(e);
        crosshairs[draggingIndex] = { x, y };
        renderScene();
    }

    function handlePointerUp() {
        if (draggingIndex !== -1) {
            draggingIndex = -1;
            renderScene();
            statusText.innerText = "👆 位置が合ったら「✅ ポール位置を確定して計算」を押してください";
            statusText.style.color = "#e65100";
        }
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);

    canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
    canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
    window.addEventListener('touchend', handlePointerUp);

    // ==========================================
    // ポール位置の確定・材積計算・保存プレビュー起動
    // ==========================================
    function confirmCrosshairScale() {
        if (!showCrosshairs || crosshairs.length !== 2) return;

        const dx = crosshairs[1].x - crosshairs[0].x;
        const dy = crosshairs[1].y - crosshairs[0].y;
        const pixelDist = Math.hypot(dx, dy);

        if (pixelDist < 5) {
            return alert("2つの十字マーカーが重なっています。ポールの両端へ離して配置してください。");
        }

        const realPoleMeters = parseFloat(document.getElementById('poleLength').value);
        if (!realPoleMeters || realPoleMeters <= 0) {
            openScaleModal();
            return;
        }

        pixelsPerMeter = pixelDist / realPoleMeters;
        isScaleConfirmed = true;
        renderScene();
        calculateVolume();

        showSavePreview();
    }

    function calculateVolume() {
        if (pixelsPerMeter === 0 || extractedPixelCount === 0) {
             currentAreaM2 = 0;
             currentVolumeM3 = 0;
             document.getElementById('resultArea').innerText = "0.000";
             document.getElementById('resultVolume').innerText = "0.000";
             return;
        }
        
        const meterPerPixel = 1 / pixelsPerMeter;
        const areaPerPixel = meterPerPixel * meterPerPixel;
        const totalAreaM2 = extractedPixelCount * areaPerPixel;
        
        const depthM = parseFloat(document.getElementById('logDepth').value) || 4.0;
        let volumeM3 = totalAreaM2 * depthM;
        
        if (document.getElementById('correctionToggle').checked) {
            volumeM3 = volumeM3 * (4 / 3.141);
        }
        
        currentAreaM2 = totalAreaM2;
        currentVolumeM3 = volumeM3;
        document.getElementById('resultArea').innerText = totalAreaM2.toFixed(3);
        document.getElementById('resultVolume').innerText = volumeM3.toFixed(3);
    }

    // ==========================================
    // 保存プレビュー生成とネイティブ共有 / 保存
    // ==========================================
    function showSavePreview() {
        statusText.innerText = "保存用画像を生成中...";
        statusText.style.color = "#1565c0";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    generateImage(position.coords.latitude.toFixed(5), position.coords.longitude.toFixed(5));
                },
                (error) => {
                    generateImage(null, null);
                },
                { timeout: 5000 }
            );
        } else {
            generateImage(null, null);
        }
    }

    function generateImage(lat, lon) {
        const offCanvas = document.createElement('canvas');
        offCanvas.width = canvas.width;
        offCanvas.height = canvas.height;
        const offCtx = offCanvas.getContext('2d');

        // 現在のキャンバス（元画像＋赤塗り＋ポール十字線）をコピー
        offCtx.drawImage(canvas, 0, 0);

        const timeStr = new Date().toLocaleString('ja-JP');
        const areaStr = currentAreaM2.toFixed(3);
        const volStr = currentVolumeM3.toFixed(3);

        const line1 = `撮影日時: ${timeStr}`;
        const line2 = (lat && lon) ? `位置情報: Lat ${lat}, Lon ${lon}` : `位置情報: 取得できませんでした`;
        const line3 = `検知: ${detectedLogCount}本 / 断面積: ${areaStr} m2 / 概算材積: ${volStr} m3`;

        // テキスト幅に合わせて左下の半透明黒ボックスを自動調整
        offCtx.font = "16px Arial";
        const maxTextWidth = Math.max(
            offCtx.measureText(line1).width,
            offCtx.measureText(line2).width,
            offCtx.measureText(line3).width
        );
        const boxWidth = Math.min(offCanvas.width - 20, Math.max(430, maxTextWidth + 24));

        offCtx.fillStyle = "rgba(0,0,0,0.6)";
        offCtx.fillRect(10, offCanvas.height - 105, boxWidth, 95);
        offCtx.fillStyle = "#FFFFFF";

        offCtx.fillText(line1, 20, offCanvas.height - 80);
        offCtx.fillText(line2, 20, offCanvas.height - 55);
        offCtx.fillText(line3, 20, offCanvas.height - 30);

        previewDataUrl = offCanvas.toDataURL('image/jpeg', 0.9);
        document.getElementById('previewImg').src = previewDataUrl;
        document.getElementById('savePreviewModal').style.display = 'block';

        const realPoleMeters = parseFloat(document.getElementById('poleLength').value) || 2.0;
        const depthM = parseFloat(document.getElementById('logDepth').value) || 4.0;
        statusText.innerText = `✅ 計算完了！（検知:${detectedLogCount}本 / ポール:${realPoleMeters}m / 奥行:${depthM}m / 材積:${volStr}m³）`;
        statusText.style.color = "#2e7d32";
    }

    function closeSaveModal() {
        document.getElementById('savePreviewModal').style.display = 'none';
    }

    async function downloadImage() {
        if (!previewDataUrl) return;
        const fileName = `層積検尺_${Date.now()}.jpg`;

        const arr = previewDataUrl.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) { u8arr[n] = bstr.charCodeAt(n); }
        const blob = new Blob([u8arr], { type: mime });
        const file = new File([blob], fileName, { type: mime });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({ files: [file], title: '層積検尺画像', text: '層積検尺の測定結果画像です' });
                closeSaveModal();
                return;
            } catch (error) {
                console.log('Share canceled or failed', error);
            }
        }

        const link = document.createElement('a');
        link.download = fileName;
        link.href = previewDataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        alert("画像を保存しました！");
        closeSaveModal();
    }
</script>
